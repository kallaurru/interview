apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
    - name: app
      image: nginx:1.25
      resources:
        requests:
          cpu: "200m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
    - name: sidecar
      image: busybox:1.36
      command: [ "sleep", "3600" ]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"